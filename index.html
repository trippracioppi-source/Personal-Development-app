<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">DEV TRACKER</div>
      <div class="level-row">
        <span id="total-level-display">Level 0</span>
        <span id="total-xp-display">0 / 100 XP</span>
      </div>
      <div class="overall-bar"><div class="overall-bar-fill" id="overall-bar-fill"></div></div>
    </header>

    <section id="stats" class="stats"></section>

    <section class="history">
      <h2>History</h2>
      <ul id="history-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
